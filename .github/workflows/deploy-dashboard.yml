name: Deploy Dashboard Expedicao

on:
  push:
    branches:
      - main
    paths:
      - 'Dashboard_Expedicao.html'
      - 'dashboard_data.json.gz'
      - 'index.html'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dashboard-expedicao
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        shell: bash
        run: |
          set -e
          rm -rf _site
          mkdir -p _site

          cp index.html _site/
          cp Dashboard_Expedicao.html _site/
          cp dashboard_data.json.gz _site/

      - name: Criar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
